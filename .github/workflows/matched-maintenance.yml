name: Matched package maintenance
on:
  push:
    branches: [matched-version-maintenance-01]
permissions:
  contents: read
jobs:
  update:
    if: github.repository == 'mohanad-hafez/maintenance-version-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      matrix:
        arm: [agent, script]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dotnet/maintenance-packages
          ref: e5aa18b677b7553d8972b71afdff9665f745746e
          path: native-source
          persist-credentials: false
      - name: Verify saved source
        working-directory: native-source
        run: |
          mkdir ../evidence
          python3 ../.github/version-maintenance/validate_maintenance.py before
      - name: Install Copilot
        if: matrix.arm == 'agent'
        run: npm install --global @github/copilot@1.0.108
      - name: Apply the original four rules
        env:
          ARM: ${{ matrix.arm }}
          GITHUB_TOKEN: ${{ matrix.arm == 'agent' && github.token || '' }}
        run: |
          if [ "$ARM" = script ]; then
            (cd native-source && python3 ../.github/version-maintenance/maintenance_replay.py script)
          else
            node -e 'const c=process.cwd(),p=c+"/.github/version-maintenance";console.log(JSON.stringify({mcpServers:{fixture:{type:"local",command:"node",args:[p+"/maintenance_agent.cjs",c+"/native-source",p+"/maintenance_replay.py",c+"/evidence"],tools:["*"]}}}))' > fixture-mcp.json
            copilot --version > evidence/version.txt
            timeout 180s copilot --disable-builtin-mcps --disable-client-telemetry \
              --additional-mcp-config=@fixture-mcp.json \
              --available-tools=fixture-scan,fixture-apply,fixture-review,fixture-submit \
              --allow-tool=fixture --no-ask-user --no-color --silent \
              --prompt "$(cat .github/version-maintenance/prompt.md)" > evidence/output.txt 2> evidence/diagnostics.txt
            test -s evidence/agent-submit.json
          fi
          (cd native-source && python3 ../.github/version-maintenance/validate_maintenance.py after)
      - name: Build and pack
        working-directory: native-source
        run: |
          ./build.sh -pack
          python3 ../.github/version-maintenance/validate_maintenance.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: maintenance-${{ matrix.arm }}
          path: evidence/
          retention-days: 14
  publish:
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        arm: [agent, script]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maintenance-${{ matrix.arm }}
          path: evidence
      - name: Publish the verified edits
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          ARM: ${{ matrix.arm }}
        with:
          retries: 0
          script: |
            const fs=require('fs');
            const result=JSON.parse(fs.readFileSync('evidence/changes.json','utf8'));
            if(result.status!=='changes')throw Error('Expected inspected source changes');
            if(result.changes.length>30)throw Error('Unexpected scope');
            const repository=context.repo;const base='version-maintenance-base-01';
            const b=await github.rest.repos.getBranch({...repository,branch:base});
            if(b.data.commit.sha!=='8b7595daed2c2f63438355b5d9b906f9e3bc0b21')throw Error('Base changed');
            const entries=[];
            for(const x of result.changes){
             if(!x.path.startsWith('src/')||x.path.split('/').includes('tests')||!['.csproj','.ilproj','.props'].some(e=>x.path.endsWith(e)))throw Error('Unexpected path');
             entries.push({path:x.path,mode:'100644',type:'blob',content:x.content});
            }
            const t=await github.rest.git.createTree({...repository,base_tree:'78868f8e65bf5951c2f40cb39c3494f1fcebe440',tree:entries});
            const c=await github.rest.git.createCommit({...repository,message:'Update package version properties',tree:t.data.sha,parents:['8b7595daed2c2f63438355b5d9b906f9e3bc0b21']});
            const head='matched-version-'+process.env.ARM+'-'+context.runId;
            await github.rest.git.createRef({...repository,ref:'refs/heads/'+head,sha:c.data.sha});
            const pr=await github.rest.pulls.create({...repository,base,head,title:'Update package version properties',body:'Applies the version property rules and verifies the package build.'});
            fs.writeFileSync('publication.json',JSON.stringify({pr:pr.data.number,url:pr.data.html_url,commit:c.data.sha,base:'8b7595daed2c2f63438355b5d9b906f9e3bc0b21',files:entries.map(x=>x.path)},null,2));
